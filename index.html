function renderAttackTable(c,cfg){const m=selectedCreature();$('attack-table').innerHTML=`<div class="table-wrap"><table><thead><tr><th>招式（单次命中）</th><th>满伤构成</th><th>防御判定</th><th>总扣血</th><th>自身踉跄</th><th>生命剩余</th><th>范围检验</th><th></th></tr></thead><tbody>${m.attacks.map((a,n)=>{const r=E.combat(a,c,cfg,state.mode,1),range=E.range(a,c,cfg,state.mode);const label=state.mode==='none'?'未防御':!a.blockable?'不可格挡':r.success?'成立':'失败';return `<tr class="${n===state.attack&&!state.customAttack?'selected-row':''}"><td>${esc(attackLabel(a,n))}<br><span class="muted">${esc(a.name)}${a.group?' · '+esc(a.group):''}</span></td><td>${Object.entries(r.incoming).filter(([k,v])=>v>0&&k!=='spirit').map(([k,v])=>TYPES[k]+' '+fmt(v)).join(' + ')||'0'}${r.incoming.spirit?'<br><span class="muted">精神伤害：角色免疫</span>':''}</td><td class="${r.success?'good':state.mode==='none'?'':'bad'}">${label}</td><td>${fmt(r.total)}${r.dot?'<br><span class="muted">含持续 '+fmt(r.dot)+'</span>':''}</td><td class="${r.selfStagger?'bad':''}">${r.selfStagger?'会':'不会'}</td><td class="${r.deadNow||r.deadLater?'bad':''}">${r.uncertain?'待核实':fmt(r.healthAfterDOT)}${r.deadNow?' · 即死':r.deadLater?' · 持续致死':''}</td><td>${range.classification==='safe'?'稳定安全':range.classification==='mixed'?'部分安全':range.classification==='uncertain'?'待核实':'无法安全承受'}</td><td><button data-attack="${n}" type="button" aria-label="查看${esc(attackLabel(a,n))}结算">查看</button></td></tr>`;}).join('')}</tbody></table></div><p class="note">${esc(name(m))} · 表中均按满伤计算；每行独立使用当前生命、耐力及踉跄值，不是连续承受所有招式。连击仅列单次命中，不模拟动画中断、持续吐息或弹幕多发命中。${m.staggerImmune?'该目标免疫踉跄，弹反成立也不会使其踉跄。':''}</p>`;}
function notice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error);}
function saveStorage(){try{localStorage.setItem('valheim-combat-loadouts',JSON.stringify(saved));return true;}catch{notice('浏览器未允许本地存储，请使用“导出配置 JSON”保存。',true);return false;}}
function renderSaved(){const selected=$('saved-list').value;$('saved-list').innerHTML=option('','选择一个方案',selected)+Object.keys(saved).map(k=>option(k,k,selected)).join('');}
function rerender(){renderForm();renderResults();}
function invalidInput(el){if(el.validity?.badInput||el.validity?.rangeUnderflow||el.validity?.rangeOverflow||el.validity?.stepMismatch||el.value===''){lastError='输入值超出允许范围或格式不正确，请检查标红的数值。';$('result-content').querySelectorAll('[data-input-error]').forEach(n=>n.remove());const p=document.createElement('p');p.className='validation';p.dataset.inputError='1';p.setAttribute('role','alert');p.textContent=lastError;$('result-content').prepend(p);return true;}lastError='';return false;}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.filter){set(el.dataset.filter,el.value);refreshFilters();persist();return;}if(el.dataset.foodTime!==undefined){if(invalidInput(el))return;const n=Number(el.dataset.foodTime);state.foods[n].remaining=Number(el.value)*60;renderResults();return;}if(el.dataset.path&&(el.type==='number'||el.type==='range')){if(invalidInput(el))return;set(el.dataset.path,Number(el.value));renderResults();}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='set-preset'){if(el.value==='')return;const set=PRESETS[Number(el.value)];for(const slot of ['helmet','chest','legs','cape'])state.gear[slot]={id:'',level:1};for(const href of set.items){const i=D.armor.find(i=>i.href===href);if(i)state.gear[i.slot]={id:i.id,level:i.maxQuality};}state.manualArmor=false;state.equipmentSearch='';rerender();return;}
 if(el.dataset.path&&el.type!=='number'&&el.type!=='range'){const path=el.dataset.path,old=val(path);let value=el.type==='checkbox'?el.checked:typeof old==='number'?Number(el.value):el.value;
 if(path.startsWith('foods.')&&path.endsWith('.id')){const n=Number(path.split('.')[1]),f=D.foods.find(f=>f.id===value);state.foods[n]={id:f?.id||'',remaining:f?.duration||0};}
 else {set(path,value);if(path==='creature'){state.attack=0;state.customAttack=false;const m=selectedCreature();if(!state.forcedStars)state.stars=Math.min(state.stars,m.maxStar);}
 if(path==='weapon.id'){state.weapon.level=1;const w=D.blockers.find(i=>i.id===value);if(w?.twoHanded)state.shield={id:'',level:1};}
 if(path==='shield.id'){state.shield.level=1;const w=D.blockers.find(i=>i.id===state.weapon.id);if(value&&w?.twoHanded)state.weapon={id:'',level:1};}
 if(path.startsWith('gear.')&&path.endsWith('.id'))state.gear[path.split('.')[1]].level=1;
 if(path==='enchant'&&!state.enchant){for(const slot of Object.keys(SLOTS)){const i=D.armor.find(i=>i.id===state.gear[slot].id);state.gear[slot].level=validLevel(i,state.gear[slot].level,false);}for(const slot of ['weapon','shield']){const i=D.blockers.find(i=>i.id===state[slot].id);state[slot].level=validLevel(i,state[slot].level,false);}}}
 rerender();}
});
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.attack!==undefined){state.attack=Number(button.dataset.attack);state.customAttack=false;rerender();$('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});return;}
 const action=button.dataset.action;if(action){if(action==='fresh'||action==='half'){for(const slot of state.foods){const f=D.foods.find(f=>f.id===slot.id);slot.remaining=f?f.duration*(action==='half'?.5:1):0;}}if(action==='max-level'){for(const slot of Object.keys(SLOTS)){const i=D.armor.find(i=>i.id===state.gear[slot].id);if(i)state.gear[slot].level=i.maxQuality;}for(const slot of ['weapon','shield']){const i=D.blockers.find(i=>i.id===state[slot].id);if(i)state[slot].level=i.maxQuality;}}
 const c=E.character(D,state);if(action==='heal')state.health=c.maxHealth;if(action==='rest')state.stamina=c.maxStamina;rerender();return;}
 if(button.id==='theme'){const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';button.textContent=light?'深色模式':'浅色模式';try{localStorage.setItem('valheim-combat-theme',light?'light':'dark');}catch{}return;}
 if(button.id==='save'){const n=$('save-name').value.trim();if(!n){notice('请先输入方案名称。',true);$('save-name').focus();return;}if(['__proto__','constructor','prototype'].includes(n)){notice('请使用其他方案名称。',true);return;}saved[n]=clone(state);if(saveStorage()){renderSaved();$('saved-list').value=n;notice('已保存：'+n);}return;}
 if(button.id==='load'){const n=$('saved-list').value;if(!saved[n]){notice('请先选择一个方案。',true);return;}try{state=sanitize(saved[n]);rerender();notice('已载入：'+n);}catch{notice('该方案格式不正确。',true);}return;}
 if(button.id==='delete'){const n=$('saved-list').value;if(!Object.hasOwn(saved,n)){notice('请先选择一个方案。',true);return;}delete saved[n];saveStorage();renderSaved();notice('已删除：'+n);return;}
 if(button.id==='export'){const content=JSON.stringify({application:'valheim-combat-calculator',schema:1,gameVersion:D.version,configuration:state},null,2),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='valheim-loadout.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notice('配置已导出。');return;}
 if(button.id==='import'){$('import-file').click();return;}
 if(button.id==='reset'){state=defaults();lastError='';rerender();notice('已载入恶骨案例：170生命上限、67手动护甲、格挡10级、3级黑金属盾。食物为示例三餐，可替换。');}
});
$('import-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('配置文件不能超过1MB');const x=JSON.parse(await file.text());if(x.application!=='valheim-combat-calculator'||x.schema!==1||!x.configuration)throw Error('请选择本工具导出的配置文件');state=sanitize(x.configuration);lastError='';rerender();notice('已导入配置。');}catch(error){notice('导入失败：'+error.message,true);}event.target.value='';});
try{const t=localStorage.getItem('valheim-combat-theme');if(t==='light'){$('theme').textContent='深色模式';document.documentElement.dataset.theme='light';}}catch{}
$('database-count').textContent=`游戏 ${D.version} · ${D.creatures.length}生物条目 / ${D.foods.length}食物 / ${D.armor.length}穿戴装备 / ${D.blockers.length}手持装备`;
$('methodology').innerHTML=`<p>适用数据：Valheim ${D.version}，Steam build ${D.build}；采集日期 ${D.date}。${D.creatures.length}个具有伤害数据的生物条目中包含首领阶段、召唤物与特殊变体；不同变体在招式名称旁显示源ID。被动且没有攻击数据的动物不作为对手。</p><ul><li>食物：基础生命25、耐力50；三种不同食物。当前加成＝完整加成 ×（剩余时间 / 总时长）<sup>0.3</sup>。回血能力不随食物加成衰减，但本版不模拟受击后的治疗。</li><li>格挡护甲＝装备基础值及等级增量 ×（1＋格挡技能 ×0.005）；弹反另乘装备弹反倍率。成功弹反的此项基础耐力消耗为0，仍要求能够进入格挡状态。持续格挡计算耐力消耗。</li><li>护甲函数：伤害 D＞2A 时，剩余 D−A；否则剩余 D²/(4A)。零护甲不减伤。混合伤害在同一护甲池按比例减伤。</li><li>踉跄容量＝命中时生命上限 ×40%。第一次判定使用盾后剩余物理与闪电伤害；如果破防，盾牌减伤取消。随后实际物理与闪电伤害再次增加踉跄。已有踉跄值也计入。</li><li>自然星级使用来源中的生成上限；开启“允许控制台星级”可模拟其他星级。星级伤害倍率为1＋0.5×星级。最高战斗难度为敌人伤害×2。多人伤害倍率为1＋0.04×（人数−1），最多计5人。</li><li>怪物随机伤害系数为 √U(0.75,1)，范围约86.60%–100%；源数据标为不掷值的攻击使用固定值。页面展示范围与确定性判定，不把掷值当成均匀概率。</li><li>身体抗性与装备抗性按游戏优先级解析，不相乘。蛇鳞盾的抗性先用于独立格挡阶段。玩家精神伤害免疫，劈砍和镐击不计为玩家伤害；真实伤害绕过普通护甲。</li><li>单次攻击按正面、时机正确、无地形或多目标伤害分摊计算。食物“来源进度”来自材料所属群系，用于筛选，不等同于完整的解锁配方校验。</li><li>饰品默认未触发；勾选后应用已核实的护甲、抗性、格挡耐力和弹反倍率效果。瞬间生命／耐力回复不自动添加到上限或当前值，需根据实际触发后的状态输入。防御不相关的进攻、移动或恢复效果仅展示。</li><li>持续伤害单列火焰与毒素在该次减伤后可施加的总量。未模拟已有持续效果、跳伤时序、重复叠加、解除与回血；潮湿燃烧或保护之杖护盾启用时标记为待核实。持续伤害条件下的“致死”为不治疗、不解除效果的模型结果。</li><li>本版不模拟整套连击、完整弹幕、环境伤害、耐久耗尽、敌人动画中断与保护之杖吸收。不能将一发弹丸或连击单击安全等同于整轮攻击安全。</li></ul><div class="source-links"><a href="https://valheimdb.com/tools/block-calculator" target="_blank" rel="noopener">格挡与踉跄</a><a href="https://valheimdb.com/food" target="_blank" rel="noopener">食物数据</a><a href="https://valheimdb.com/armor" target="_blank" rel="noopener">穿戴装备</a><a href="https://valheimdb.com/world-modifiers" target="_blank" rel="noopener">世界难度</a><a href="https://valheimdb.com/multiplayer/scaling" target="_blank" rel="noopener">多人倍率</a><a href="https://valheimdb.com/status-effects" target="_blank" rel="noopener">增益与饰品</a><a href="https://corpus.gg/games/valheim/mechanics/damage-over-time" target="_blank" rel="noopener">持续伤害范围</a></div><p>怪物、食物、装备中英文名、基础数值、成长、招式及可格挡性整理自 Valheim Database 公布的游戏文件数据。本工具独立实现交互和计算逻辑，没有联网依赖或遥测。</p>`;
renderForm();renderResults();renderSaved();
})();
</script>
